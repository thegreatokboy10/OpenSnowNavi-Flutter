name: snownavi
description: Ultimate Ski Route Planner

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 0.0.1+1

environment:
  sdk: '>=2.19.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  mapbox_gl: ^0.16.0
  english_words: ^4.0.0
  provider: ^6.0.0
  http: ^1.0.0
  polyline_codec: ^0.1.6
  url_launcher: ^6.0.20
  location: ^5.0.0
  go_router: ^14.7.2
  image_picker_web: any # For selecting an image
  exif: ^3.1.1         # For extracting GPS metadata
  fl_chart: ^0.66.0  # Check for the latest version

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0

flutter:
  fonts:
      - family: NotoEmoji
        fonts:
          - asset: assets/fonts/NotoEmoji.ttf
  uses-material-design: true
  assets:
    - assets/3valley/lifts.geojson
    - assets/3valley/runs.geojson
    - assets/beidahu/lifts.geojson
    - assets/beidahu/runs.geojson
    - assets/morzine/lifts.geojson
    - assets/morzine/runs.geojson
    - assets/palarinsal/lifts.geojson
    - assets/palarinsal/runs.geojson
    - assets/icons/